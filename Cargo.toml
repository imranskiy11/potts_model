[package]
name    = "potts_model"
version = "0.1.0"
edition = "2021"

[features]
default = ["cuda"]
cuda = ["cust", "nvml-wrapper"]
cpu  = []

[dependencies]
# ── вычисления ────────────────────────────────
rand         = "0.8"
rand_chacha  = "0.3"
rand_distr   = "0.4"
crossbeam    = "0.8"
glam         = "0.20"

# ── GUI ───────────────────────────────────────
eframe    = { version = "0.24", features = ["glow"] }
egui      = "0.24"
egui_plot = "0.24"

palette  = "0.7"
bytemuck = { version = "1.13", features = ["derive"] }

# ── монитор ──────────────────────────────────
sysinfo        = "0.29"
nvml-wrapper   = { version = "0.9", optional = true }

serde = { version = "1.0", features = ["derive"] }
csv   = "1.3"

# ── CUDA ─────────────────────────────────────
cust = { version = "0.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser","windef"] }
